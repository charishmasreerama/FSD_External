<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math object</title>
    <script>
        function mathObject(){
            let randomNumber=Math.random();
            let roundedNumber=Math.round(7.8);
            let sqrtNumber=Math.sqrt(64);
            alert("Random number:"+randomNumber)
            alert("Rounded Number:"+roundedNumber);
            alert("Square rot of 64:" +sqrtNumber)

        }
    </script>
</head>
<body>
    <h1>Math Object Method</h1>
    <button onclick="mathObject()">Math Operation</button>
</body>
</html>
