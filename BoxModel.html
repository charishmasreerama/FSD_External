<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .box{
            width: 200px;
            padding: 20px;
            border: 5px solid blue;
            margin: 20px;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>This is the demonstration of Box model</p>
        <p>This is the properties of box model:</p>
        <ul>
            <li>Content</li>
            <li>Padding</li>
            <li>Border</li>
            <li>Margin</li>
        </ul>
    </div>
    
</body>
</html>
