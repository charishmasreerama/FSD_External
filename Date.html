<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Object</title>
    <script>
        function dateObject(){
        let currentDate = new Date();
        alert("Current Date:" +currentDate);
        alert("Current Year:" +currentDate.getFullYear());
        alert("Current Month:" +currentDate.getMonth()+1);
        }
    </script>
</head>
<body>
    <h1>Date Object Method</h1>
    <button onclick="dateObject()">Date method</button>
</body>
</html>
